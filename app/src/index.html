<style>
/* Layout: one reading column under a slim sticky bar (home, book title, review badge, menu). The book page is the main view. */
:root {
  --paper: #F5F7FA; --surface: #FFFFFF; --ink: #1A2130; --ink-2: #4A5468; --ink-3: #6B7588;
  --rule: #DCE1E9; --accent: #2B5BD7; --accent-ink: #FFFFFF; --chip: #E9EDF4;
  --mark: #FFE27A; --mark-ink: #1A2130; --hint: #A0560F; --learn: #7E9BE6; --good: #1F7A4D;
  --serif: "Literata", "Iowan Old Style", Georgia, serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10141A; --surface: #171B22; --ink: #E6E9EF; --ink-2: #AEB6C4; --ink-3: #8790A1;
  --rule: #2A313C; --accent: #7EA2FF; --accent-ink: #0E1420; --chip: #232934;
  --mark: #5E4E12; --mark-ink: #FFF4C8; --hint: #E9A15B; --learn: #5A78C8; --good: #5BC28F; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10141A; --surface: #171B22; --ink: #E6E9EF; --ink-2: #AEB6C4; --ink-3: #8790A1;
  --rule: #2A313C; --accent: #7EA2FF; --accent-ink: #0E1420; --chip: #232934;
  --mark: #5E4E12; --mark-ink: #FFF4C8; --hint: #E9A15B; --learn: #5A78C8; --good: #5BC28F; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 720px; margin: 0 auto; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 52px; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 1.12rem; background: none; border: 0; color: var(--ink); padding: 4px 0; cursor: pointer; white-space: nowrap; }
.brand span { background: linear-gradient(transparent 14%, var(--mark) 14%, var(--mark) 86%, transparent 86%); color: var(--mark-ink); padding: 0 0.1em; border-radius: 2px; }
.book-name { color: var(--ink-2); font-size: 0.92rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.top-acts { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
.progress { height: 3px; background: var(--chip); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
main { max-width: 720px; margin: 0 auto; padding-block: 22px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.12; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; line-height: 1.3; }
p { margin: 0; max-width: 64ch; }
.lede { font-size: 1.08rem; color: var(--ink-2); }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.meta { color: var(--ink-3); font-size: 0.88rem; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: clamp(16px, 3.5vw, 24px); display: grid; gap: 14px; min-width: 0; }
button, select, input, textarea { font: inherit; color: var(--ink); }
.btn { font-size: 0.95rem; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--rule); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.big { padding: 13px 22px; font-size: 1.05rem; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 10px; }
.btn.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: inherit; }
.btn:disabled { opacity: 0.45; cursor: default; }
.badge { display: inline-flex; align-items: center; gap: 6px; }
.badge b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: 0.78rem; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="text"], textarea { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.notice { background: var(--chip); border-radius: 10px; padding: 10px 14px; font-size: 0.92rem; color: var(--ink-2); }
.notice.err { color: var(--hint); }
.tnum { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 7px 12px; cursor: pointer; font-size: 0.92rem; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); font-weight: 700; }
a { color: var(--accent); }
summary { cursor: pointer; }

/* home */
.drop { border: 2px dashed var(--rule); border-radius: 12px; padding: clamp(16px, 4vw, 26px); display: grid; gap: 10px; justify-items: start; background: var(--surface); }
.drop.over { border-color: var(--accent); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.book { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 14px; cursor: pointer; display: grid; gap: 6px; align-content: start; min-height: 120px; }
.book:hover { border-color: var(--accent); }
.book b { font-family: var(--serif); font-size: 1.05rem; line-height: 1.25; }
.book small { color: var(--ink-3); }
.tag { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 2px 8px; width: fit-content; }
.bar { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* onboarding */
.levels { display: grid; gap: 8px; }
.level { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; text-align: left; border: 1px solid var(--rule);
  background: var(--surface); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
.level[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.level .t { font-weight: 700; }
.level .d { color: var(--ink-3); font-size: 0.88rem; grid-column: 1; }
.level .n { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-family: var(--serif); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.level .n small { display: block; font-family: var(--sans); font-size: 0.72rem; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-family: var(--serif); font-size: 1rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* the page */
.pagehead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; min-height: 1.2em; }
.legend { border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; font-size: 0.95rem; }
.legend ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.legend li { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 12px; align-items: baseline; }
.legend .ex { font-family: var(--serif); font-size: 1.05rem; line-height: 2.2; }
.text { font-family: var(--serif); font-size: 1.16rem; line-height: 2.2; }
.text p { margin: 0 0 0.8em; max-width: none; }
.text h2 { font-size: 1.2rem; margin: 0.2em 0 0.6em; line-height: 1.6; }
[data-w] { cursor: pointer; }
ruby { ruby-position: under; ruby-align: center; white-space: nowrap; }
rt { font-family: var(--sans); font-size: 0.56em; letter-spacing: 0; font-weight: 400; ruby-align: center; text-align: center; }
.w-new { background: linear-gradient(transparent 8%, var(--mark) 8%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); border-radius: 2px; }
ruby.w-new rt { color: var(--ink); font-weight: 700; }
.w-learn { text-decoration: underline; text-decoration-color: var(--learn); text-decoration-thickness: 2px; text-underline-offset: 5px; }
ruby.w-fade rt { color: var(--learn); }
ruby.w-hint rt { color: var(--hint); }
.w-tap { text-decoration: underline dotted var(--hint); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.recap { display: grid; gap: 10px; }
.recap ul { list-style: none; margin: 0; padding: 0; display: grid; }
.recap li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.recap li:first-child { border-top: 0; }
.recap .lw { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; }
.recap .lm { color: var(--ink-2); font-size: 0.92rem; grid-column: 1; }
.recap .knew { grid-row: 1 / span 2; grid-column: 2; }
.recap li.known .lw, .recap li.known .lm { color: var(--ink-3); text-decoration: line-through; }
.turn { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.turn .btn.primary { flex: 0 1 260px; }

/* review */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(20px, 5vw, 34px); display: grid; gap: 18px; min-height: 240px; align-content: start; }
.card .ex { font-family: var(--serif); font-size: clamp(1.15rem, 3.6vw, 1.35rem); line-height: 1.6; }
.card .ex b { background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%); color: var(--mark-ink); font-weight: 600; padding: 0 2px; }
.card .ans { border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 4px; }
.card .lemma { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
.card .mean { font-size: 1.08rem; color: var(--ink-2); }
.acts { display: flex; flex-wrap: wrap; gap: 10px; }
.acts .btn { flex: 1 1 140px; padding-block: 12px; }

/* menu */
ol.toc { list-style: none; margin: 0; padding: 0; display: grid; max-height: 340px; overflow-y: auto; }
ol.toc li button { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 4px; border: 0; border-top: 1px solid var(--rule); background: none; cursor: pointer; }
ol.toc li:first-child button { border-top: 0; }
ol.toc li button span:first-child { overflow-wrap: anywhere; }
ol.toc li.here button { font-weight: 700; color: var(--accent); }
.setting { display: grid; gap: 6px; }
.setting > span:first-child { font-weight: 700; font-size: 0.95rem; }

.pop { position: fixed; z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); display: grid; gap: 6px; font-size: 0.95rem; }
.pop .pw { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.pop .row { gap: 12px; }
footer.foot { font-size: 0.8rem; color: var(--ink-3); }
.spin { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -0.15em; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .progress i { transition: none; } }
@media (max-width: 520px) {
  .legend li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .turn .btn.primary { flex: 1 1 auto; }
  .text { font-size: 1.1rem; }
}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" type="button" aria-label="Readfirst: your books">Read<span>first</span></button>
    <div class="book-name" id="book-name"></div>
    <div class="top-acts" id="top-acts"></div>
  </div>
  <div class="progress" id="progress" hidden><i></i></div>

<main id="view"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>/*ENGINE*/</script>
<script>
"use strict";
const R = window.Readfirst;
const LANGS = {es: "Spanish", fr: "French", de: "German", en: "English"};
const SAMPLES = [
  {file: "samples/es-marianela.txt", title: "Marianela", author: "Benito Pérez Galdós, 1878", lang: "es"},
  {file: "samples/fr-candide.txt", title: "Candide", author: "Voltaire, 1759", lang: "fr"},
  {file: "samples/de-die-verwandlung.txt", title: "Die Verwandlung", author: "Franz Kafka, 1915", lang: "de"},
  {file: "samples/en-alice.txt", title: "Alice’s Adventures in Wonderland", author: "Lewis Carroll, 1865", lang: "en"},
];
const LEVELS = [
  {n: 0, t: "I’m just starting", d: "a few words at most"},
  {n: 500, t: "I know some basics", d: "the most common words, about 500"},
  {n: 2000, t: "I can read simple texts", d: "about 2,000 words"},
  {n: 5000, t: "I read with a dictionary", d: "about 5,000 words"},
];
const LEGEND = {                                    // examples for the first-page legend: [new word, meaning], [rare word, meaning], word being learned
  es: [["palabra", "word"], ["umbral", "threshold"], "aprendida"], fr: [["mot", "word"], ["seuil", "threshold"], "appris"],
  de: [["Wort", "word"], ["Schwelle", "threshold"], "gelernt"], en: [["word", "unit of language"], ["threshold", "doorway"], "learned"],
};
const PAGE = 220;                                   // words per screen page
const PER_PAGE = {5: "Fewer", 8: "Standard", 12: "More"};
const FADE = 2;                                     // pages a new word keeps its meaning under it, after the page that introduced it
const INTERVALS = [0, 1, 3, 7, 16, 35, 80];         // days to the next review, by box
const STOP = {
  es: "de la que el en y a los se del las un por con no una su para es al lo como más pero sus le ya o fue este ha sí porque esta",
  fr: "de la le et les des en un du une que est pour qui dans par plus pas au sur ne se ce il sont avec elle mais nous",
  de: "der die und in den von zu das mit sich des auf für ist im dem nicht ein eine als auch es an werden aus er hat",
  en: "the of and to a in that is was he for it with as his on be at by i had not are but from she they you",
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
const plural = (n, w, ws) => `${fmt(n)} ${n === 1 ? w : (ws || w + "s")}`;
const pct = x => `${Math.round(100 * x)}%`;
const day = (offset = 0) => { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const wiktionary = (lang, w) => `https://en.wiktionary.org/wiki/${encodeURIComponent(w)}#${LANGS[lang]}`;
const tick = () => new Promise(r => setTimeout(r, 30));

// ------------------------------------------------------------------ storage
const LS = {
  get(k) { try { const v = localStorage.getItem("rf3:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("rf3:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem("rf3:" + k); } catch (e) { /* nothing to remove */ } },
  old(k) { try { const v = localStorage.getItem("rf2:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
};
const IDB = {
  db: null,
  async open() {
    if (this.db !== null) return this.db;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("readfirst", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("books", {keyPath: "id"});
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = false; }
    return this.db;
  },
  async run(mode, fn) {
    const db = await this.open();
    if (!db) return null;
    try {
      return await new Promise((res, rej) => {
        const tx = db.transaction("books", mode), req = fn(tx.objectStore("books"));
        tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
      });
    } catch (e) { return null; }
  },
  put(book) { return this.run("readwrite", s => s.put(book)); },
  get(id) { return this.run("readonly", s => s.get(id)); },
  del(id) { return this.run("readwrite", s => s.delete(id)); },
};

// ---------------------------------------------------------------- state
const A = {view: "home", busy: "", error: "", info: ""};
const langCache = {};
async function loadLang(lang) {
  if (langCache[lang]) return langCache[lang];
  const r = await fetch(`data/${lang}.json`);
  if (!r.ok) throw new Error(`the ${LANGS[lang]} word list did not load (${r.status}); check your connection and try again`);
  langCache[lang] = R.loadLanguage(await r.json());
  return langCache[lang];
}
function fnv(text, seed) {
  let h = seed >>> 0;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, "0");
}
const bookId = paras => { const t = paras.map(p => p.text).join("\n"); return fnv(t, 2166136261) + fnv(t, 3323198485); };
function guessLang(paras) {
  const words = paras.slice(0, 400).map(p => p.text).join(" ").toLowerCase().slice(0, 40000).match(/\p{L}+/gu) || [];
  let best = "en", score = -1;
  for (const [lang, list] of Object.entries(STOP)) {
    const set = new Set(list.split(" "));
    const s = words.reduce((n, w) => n + (set.has(w) ? 1 : 0), 0);
    if (s > score) { score = s; best = lang; }
  }
  return best;
}
/** Drop the publisher's closing lines ("End of the Project Gutenberg EBook of ..."), and find chapter
 * headings written as a bare Roman numeral ("-II-"), joined with the chapter title on the next line. */
const NUMERAL = /^[\s\-—–_.*·]*([IVXLC]{1,7})[\s\-—–_.*·]*$/;
function cleanParas(paras) {
  let end = paras.length;
  for (let i = Math.max(0, paras.length - 8); i < paras.length; i++) {
    if (/^\s*end of (the |this )?project gutenberg/i.test(paras[i].text)) { end = i; break; }
  }
  const out = [];
  for (let i = 0; i < end; i++) {
    const p = paras[i], m = p.heading ? null : NUMERAL.exec(p.text);
    if (!m) { out.push(p); continue; }
    const next = i + 1 < end ? paras[i + 1] : null;
    if (next && next.text.split(/\s+/).length <= 8 && /^\p{Lu}/u.test(next.text) && !/[.!?;:,»"”—-]$/u.test(next.text.trim())) {
      out.push({text: `${m[1]}. ${next.text.trim()}`, heading: true}); i++;
    } else out.push({text: `${m[1]}.`, heading: true});
  }
  return out;
}

// ---------------------------------------------------------------- import
async function readEpub(buf) {
  if (!window.JSZip) throw new Error("the EPUB reader did not load; check your connection and try again");
  const zip = await JSZip.loadAsync(buf);
  if (zip.file("META-INF/encryption.xml")) {
    const enc = await zip.file("META-INF/encryption.xml").async("string");
    if (/EncryptedData/.test(enc) && !/obfuscation|font/i.test(enc)) throw new Error("this EPUB is copy-protected (DRM). Readfirst can open DRM-free EPUBs and plain text files");
  }
  const cont = await zip.file("META-INF/container.xml")?.async("string");
  if (!cont) throw new Error("this file is not a valid EPUB");
  const parse = s => new DOMParser().parseFromString(s, "application/xml");
  const opfPath = parse(cont).querySelector("rootfile")?.getAttribute("full-path");
  if (!opfPath || !zip.file(opfPath)) throw new Error("this file is not a valid EPUB");
  const opf = parse(await zip.file(opfPath).async("string"));
  const base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
  const items = {};
  for (const it of opf.getElementsByTagName("item")) items[it.getAttribute("id")] = it;
  const title = opf.getElementsByTagName("dc:title")[0]?.textContent?.trim() || "";
  const language = (opf.getElementsByTagName("dc:language")[0]?.textContent || "").trim().slice(0, 2).toLowerCase();
  const paras = [];
  for (const ref of opf.getElementsByTagName("itemref")) {
    const it = items[ref.getAttribute("idref")];
    if (!it || !/x?html/.test(it.getAttribute("media-type") || "")) continue;
    const href = decodeURIComponent(new URL(it.getAttribute("href"), "http://x/" + base).pathname.slice(1));
    const f = zip.file(href);

          if (!shown.has(nw) && g) { shown.add(nw); out += `<ruby class="w-new" data-w="${esc(nw)}">${word}<rt>${esc(g)}</rt></ruby>`; }
          else out += `<span class="w-new" data-w="${esc(nw)}">${word}</span>`;
          continue;
        }
        const unknown = ws.filter(w => !known.has(w));
        if (!unknown.length) { out += `<span data-w="${esc(t.key)}">${word}</span>`; continue; }
        const rare = unknown.find(w => !st.intro[w]);
        if (rare === undefined) {                    // being learned
          const w = unknown[0], c = st.intro[w], g = tiny(gloss(w, t.text));
          if ((c.n || 0) < FADE && c.p !== p && g && !shown.has(w)) { shown.add(w); out += `<ruby class="w-learn w-fade" data-w="${esc(w)}">${word}<rt>${esc(g)}</rt></ruby>`; }
          else out += `<span class="w-learn" data-w="${esc(w)}">${word}</span>`;
          continue;
        }
        const g = tiny(gloss(rare, t.text));
        out += under && g ? `<ruby class="w-hint" data-w="${esc(rare)}">${word}<rt>${esc(g)}</rt></ruby>` : `<span class="w-tap" data-w="${esc(rare)}">${word}</span>`;
      }
      return out + esc(s.text.slice(at));
    }).join(" ");
    html += par.heading ? `<h2>${inner}</h2>` : `<p>${inner}</p>`;
  }
  return html;
}

function viewRead() {
  const st = A.st, p = A.cur, page = A.pages[p];
  const fresh = freshOn(p);
  const due = dueWords().length;
  const ex = LEGEND[st.lang] || LEGEND.en;
  const legend = LS.get("legend-seen") ? "" : `
    <div class="legend" role="note">
      <ul>
        <li><span class="ex" lang="${st.lang}"><ruby class="w-new">${ex[0][0]}<rt>${ex[0][1]}</rt></ruby></span><span><b>A new word worth learning.</b> At most ${st.perPage} a page, with the meaning under it. It comes back often in this book.</span></li>
        <li><span class="ex" lang="${st.lang}"><ruby class="w-hint">${ex[1][0]}<rt>${ex[1][1]}</rt></ruby></span><span><b>A rarer word.</b> Read the hint and go on; no need to learn it.</span></li>
        <li><span class="ex" lang="${st.lang}"><span class="w-learn">${ex[2]}</span></span><span><b>A word you’re learning.</b> Its meaning stays under it for a couple of pages, then fades. Tap it if you forget.</span></li>
      </ul>
      <p class="meta">Tap any word for its meaning, or to say you already know it.</p>
      <div><button class="btn" type="button" data-act="legend-ok">Got it</button></div>
    </div>`;
  const banner = due && A.reviewLater !== day() ? `<div class="notice row" style="justify-content:space-between">
      <span>${plural(due, "word")} from earlier pages to review, about ${plural(Math.max(1, Math.round(due / 6)), "minute")}.</span>
      <span class="row" style="gap:4px"><button class="btn primary" type="button" data-act="review">Review</button><button class="btn quiet" type="button" data-act="review-later">Later</button></span></div>` : "";
  const known = knownSet();
  const recap = fresh.length ? `
    <section class="panel recap" aria-labelledby="recap-h">
      <h2 id="recap-h">New on this page</h2>
      <ul>${fresh.map(w => {
        const isKnown = known.has(w), c = st.intro[w], g = gloss(w, c.f);
        return `<li class="${isKnown ? "known" : ""}"><span class="lw" lang="${st.lang}">${esc(w)}</span>
          <span class="lm">${g ? esc(g) : `<a href="${wiktionary(st.lang, w)}" target="_blank" rel="noopener">look it up</a>`}</span>
          <button class="btn quiet knew" type="button" data-act="knew" data-w="${esc(w)}">${isKnown ? "Undo" : "I knew it"}</button></li>`;
      }).join("")}</ul>
      <p class="meta">They come back for a short review over the next days. “I knew it” takes a word off your list.</p>
    </section>` : "";
  const startsWithHeading = A.doc.paragraphs[page.pieces[0][0]].heading;
  const last = p === A.pages.length - 1;
  return `
  ${banner}
  <div class="pagehead"><span class="eyebrow">${startsWithHeading ? "" : esc((page.chapter || "").slice(0, 60))}</span><span class="meta tnum">Page ${fmt(p + 1)} of ${fmt(A.pages.length)}</span></div>
  ${legend}
  <article class="text" id="text" lang="${st.lang}">${renderPageText(p, fresh)}</article>
  ${recap}
  <div class="turn">
    <button class="btn" type="button" data-act="prev" ${p === 0 ? "disabled" : ""}>← Back</button>
    ${last ? `<span class="meta">The end of the book.</span>` : `<button class="btn primary big" type="button" data-act="next">Next page →</button>`}
  </div>`;
}

/** Leaving page p: its new words go into review; words being learned that it showed count one more page. */
function leavePage(p) {
  const st = A.st;
  for (const c of Object.values(st.intro)) if (c.p === p && c.b === 0) { c.b = 1; c.d = day(1); }
  if (st.counted === undefined) st.counted = {};
  if (st.counted[p]) return;
  st.counted[p] = 1;
  const seen = new Set();
  for (const s of R.pageSentences(A.doc, A.pages[p])) for (const w of R.wordsOf(s)) seen.add(w);
  for (const w of seen) { const c = st.intro[w]; if (c && c.p !== p) c.n = (c.n || 0) + 1; }
}
function goTo(q) {
  const st = A.st;
  leavePage(A.cur);
  q = Math.max(0, Math.min(A.pages.length - 1, q));
  st.anchor = firstAnchor(q);
  A.cur = q;
  saveState();
  A.view = "read"; render(); window.scrollTo(0, 0);
}
function markKnown(w, yes) {
  const st = A.st;
  if (yes) { if (!st.marked.includes(w)) st.marked.push(w); }
  else st.marked = st.marked.filter(x => x !== w);
  plan(); saveState();
}

// -------------------------------------------------------------- review
function startReview() {
  const words = dueWords();
  A.rv = {queue: words.map(w => ({w, again: false})), shown: false, done: 0, total: words.length, forgot: 0};
  A.view = "review"; render(); window.scrollTo(0, 0);
}
function viewReview() {
  const rv = A.rv, st = A.st, it = rv.queue[0];
  if (!it) return `<div class="card"><p class="eyebrow">Review</p><h2>${rv.total ? "All done." : "Nothing to review right now."}</h2>
    <p class="meta">${rv.total ? `${plural(rv.total, "word")} reviewed${rv.forgot ? `; ${rv.forgot} will come back tomorrow` : ""}.` : "Words come back here the day after you meet them, then after longer and longer gaps."}</p>
    <div class="acts"><button class="btn primary" type="button" data-act="to-page">Back to page ${fmt(A.cur + 1)}</button></div></div>`;
  const c = st.intro[it.w] || {};
  const g = gloss(it.w, c.f);
  return `
  <div class="row" style="justify-content:space-between"><span class="eyebrow">Review</span><span class="meta tnum">${Math.min(rv.done + 1, rv.total)} of ${rv.total}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * rv.done / Math.max(1, rv.total))}%"></i></div>
  <div class="card">
    <p class="ex" lang="${st.lang}">${c.x || `<b>${esc(it.w)}</b>`}</p>
    ${rv.shown ? `<div class="ans"><span class="lemma" lang="${st.lang}">${esc(it.w)}</span><span class="mean">${g ? esc(g) : `<a href="${wiktionary(st.lang, it.w)}" target="_blank" rel="noopener">Look it up on Wiktionary</a>`}</span></div>
      <div class="acts"><button class="btn" type="button" data-act="forgot">I forgot</button><button class="btn primary" type="button" data-act="remembered">I remembered</button></div>`
    : `<p class="meta">What does the marked word mean?</p><div class="acts"><button class="btn primary" type="button" data-act="show">Show the meaning</button></div>`}
  </div>
  <div><button class="btn quiet" type="button" data-act="to-page">Stop and go back to the book</button></div>`;
}
function answer(ok) {
  const rv = A.rv, it = rv.queue.shift(), c = A.st.intro[it.w];
  if (c) {
    if (ok) { c.b = it.again ? 1 : Math.min(INTERVALS.length - 1, c.b + 1); c.d = day(INTERVALS[c.b]); rv.done++; }
    else if (!it.again) { rv.forgot++; c.b = 1; c.d = day(1); rv.queue.splice(Math.min(3, rv.queue.length), 0, {w: it.w, again: true}); }
    else rv.done++;
  }
  rv.shown = false; saveState(); render();
}

// ---------------------------------------------------------- saving
function saveState() {
  const st = A.st;
  if (!st) return;
  st.updated = Date.now();
  if (!LS.set("book:" + st.id, st)) A.error = "This browser would not save your progress (storage is full or blocked). Use “Back up progress” in the menu to keep it.";
  const lib = (LS.get("library") || []).filter(b => b.id !== st.id);
  lib.unshift({id: st.id, title: st.title, lang: st.lang, page: A.cur || 0, pages: A.pages ? A.pages.length : null,
               learning: Object.keys(st.intro).filter(w => !st.marked.includes(w)).length, sample: st.sample || null, updated: st.updated});
  LS.set("library", lib.slice(0, 30));
}
/** Progress saved by the earlier version of the app (flashcards before each part of the book). */
function migrate(old) {
  if (!old || !old.id || !old.cards) return null;
  const intro = {};
  for (const [w, c] of Object.entries(old.cards)) intro[w] = {p: -1, b: Math.max(1, c.b || 1), d: c.d || day(1), n: FADE, f: c.f || w, x: c.x || ""};
  return {v: 3, id: old.id, title: old.title, lang: old.lang, start: old.start, base: old.base || [], levelLabel: "From your earlier setup",
          marked: old.marked || [], intro, decided: {}, anchor: null, oldSession: old.cur || 0, perPage: 8, hints: "under",
          source: old.source, sample: old.sample, created: old.created || Date.now()};
}
async function resume(st) {
  A.st = st;
  if (!st.decided) st.decided = {};
  await analyse(st.lang, st.start);
  if (!st.anchor) {
    const ss = R.sessionsOf(A.doc);
    st.anchor = ss.length ? [ss[Math.min(st.oldSession || 0, ss.length - 1)].paragraphs[0], 0] : firstAnchor(0);
  }
  plan(); saveState();
  A.view = "read"; render(); window.scrollTo(0, 0);
}
async function openFromLibrary(entry) {
  const st = LS.get("book:" + entry.id);
  if (!st) { A.error = "That book’s progress is no longer in this browser."; render(); return; }
  A.busy = `Opening ${entry.title}…`; render(); await tick();
  try {
    let rec = await IDB.get(entry.id);
    if (!rec && st.sample) rec = {id: entry.id, title: st.title, lang: st.lang, paras: cleanParas(await fetchSample(st.sample)), source: "sample", sample: st.sample};
    if (!rec) { A.busy = ""; A.info = `To continue “${entry.title}”, open the same book file again; your progress picks up where you left off.`; A.view = "home"; render(); return; }
    A.book = rec;
    await resume(st);
  } catch (e) { fail(e.message || String(e)); }
}

// ---------------------------------------------------------- export
async function offerFile(filename, data, label) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename, data}); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  let framed = true;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed) {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type: "text/plain"}));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      return;
    } catch (e) { /* fall back to copying */ }
  }
  A.copyText = {label, data}; render();
}
function ankiText() {
  const st = A.st, rows = ["#separator:tab", "#html:true", "#tags column:4"];
  const clean = s => String(s).replace(/[\t\n]/g, " ");
  for (const [w, c] of Object.entries(st.intro)) {
    if (st.marked.includes(w)) continue;
    rows.push([clean(w), clean(gloss(w, c.f) || ""), clean(c.x || ""), "readfirst"].join("\t"));
  }
  return rows.join("\n") + "\n";
}
async function restore(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data.readfirst || !data.state || !data.state.id) throw new Error("this is not a Readfirst backup");
    const st = data.state.v === 3 ? data.state : migrate(data.state);
    if (!st) throw new Error("this backup is from an unknown version");
    LS.set("book:" + st.id, st);
    const lib = (LS.get("library") || []).filter(b => b.id !== st.id);
    lib.unshift({id: st.id, title: st.title, lang: st.lang, page: 0, pages: null, learning: Object.keys(st.intro).length, sample: st.sample || null, updated: Date.now()});
    LS.set("library", lib);
    A.error = ""; A.info = `Restored “${st.title}”. Open it under Continue reading.`;
    A.view = "home"; render();
  } catch (e) { A.error = "Could not restore: " + (e.message || e); render(); }
}

// ------------------------------------------------------------- render
function render() {
  hidePop();
  const v = $("view"), inBook = A.st && ["read", "review", "menu"].includes(A.view);
  $("book-name").textContent = inBook ? A.st.title : (A.view === "onboard" || A.view === "check") && A.ob ? A.ob.title : "";
  const due = inBook && !A.busy ? dueWords().length : 0;
  $("top-acts").innerHTML = inBook && !A.busy ? `
    ${A.view !== "review" && due ? `<button class="btn quiet badge" type="button" data-act="review" aria-label="Review ${plural(due, "word")}">Review <b>${fmt(due)}</b></button>` : ""}
    <button class="btn quiet" type="button" data-act="${A.view === "menu" ? "to-page" : "menu"}">${A.view === "menu" ? "Close" : "Menu"}</button>` : "";
  const prog = $("progress");
  prog.hidden = !(inBook && A.pages && !A.busy);
  if (!prog.hidden) prog.firstElementChild.style.width = `${100 * (A.cur + 1) / A.pages.length}%`;
  if (A.busy) { v.innerHTML = `<div class="panel" role="status"><p><span class="spin" aria-hidden="true"></span> ${esc(A.busy)}</p></div>`; return; }
  const err = A.error ? `<p class="notice err" role="alert">${esc(A.error)}</p>` : "";
  v.innerHTML = err + ({home: viewHome, onboard: viewOnboard, check: viewCheck, read: viewRead, review: viewReview, menu: viewMenu}[A.view] || viewHome)();
}

const pop = $("pop");
function hidePop() { pop.hidden = true; A.popWord = null; }
function showPop(el) {
  const st = A.st, w = el.dataset.w;

  const g = gloss(w, form), known = knownSet().has(w), learning = !!st.intro[w] && !known;
  A.popWord = w;
  pop.innerHTML = `<span class="pw" lang="${st.lang}">${esc(w)}</span>
    ${form.toLowerCase() !== w.toLowerCase() ? `<span class="meta">dictionary form of “${esc(form)}”</span>` : ""}
    <span>${g ? esc(g) : "Not in the dictionary."}</span>
    ${learning ? `<span class="meta">You’re learning this word.</span>` : ""}
    <div class="row"><button class="btn" type="button" data-act="pop-known">${known ? "I don’t know it after all" : "I know this word"}</button>
    <a href="${wiktionary(st.lang, w)}" target="_blank" rel="noopener">Wiktionary</a></div>`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), wdt = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(16, Math.min(window.innerWidth - wdt - 16, r.left)) + "px";
  pop.style.top = (r.bottom + 8 + h > window.innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + "px";
}
window.addEventListener("scroll", () => { if (!pop.hidden) hidePop(); }, {passive: true});

document.addEventListener("click", async ev => {
  const wordEl = ev.target.closest("#text [data-w]");
  if (wordEl) { showPop(wordEl); return; }
  if (!ev.target.closest("#pop")) hidePop();
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act !== "copy") A.error = "";
  switch (act) {
    case "pick": $("file").click(); break;
    case "sample": A.info = ""; openSample(SAMPLES[+el.dataset.i]); break;
    case "lib": A.info = ""; openFromLibrary((LS.get("library") || [])[+el.dataset.i]); break;
    case "level": A.ob.level = +el.dataset.i; render(); break;
    case "check": startCheck(); break;
    case "toggle": { const k = el.dataset.k, y = A.check.yes; if (y.has(k)) y.delete(k); else y.add(k); el.setAttribute("aria-pressed", y.has(k)); break; }
    case "check-done": finishCheck(); break;
    case "check-cancel": A.view = "onboard"; render(); break;
    case "begin": begin(); break;
    case "legend-ok": LS.set("legend-seen", true); render(); break;
    case "next": goTo(A.cur + 1); break;
    case "prev": goTo(A.cur - 1); break;
    case "knew": { const w = el.dataset.w; markKnown(w, !knownSet().has(w)); render(); break; }
    case "pop-known": { const w = A.popWord; if (w) markKnown(w, !knownSet().has(w)); render(); break; }
    case "review": startReview(); break;
    case "review-later": A.reviewLater = day(); render(); break;
    case "show": A.rv.shown = true; render(); break;
    case "remembered": answer(true); break;
    case "forgot": answer(false); break;
    case "to-page": A.view = "read"; A.ob = null; A.copyText = null; A.confirmForget = false; A.info = ""; render(); window.scrollTo(0, 0); break;
    case "menu": A.view = "menu"; render(); window.scrollTo(0, 0); break;
    case "jump": goTo(+el.dataset.p); break;
    case "per-page": A.st.perPage = +el.dataset.n; saveState(); render(); break;
    case "hints": A.st.hints = el.dataset.v; saveState(); render(); break;
    case "relevel": A.ob = {lang: A.st.lang, title: A.st.title, level: null, check: null, start: A.st.start, relevel: true}; A.view = "onboard"; render(); window.scrollTo(0, 0); break;
    case "add-known": {
      const before = A.st.marked.length;
      for (const w of $("add-known").value.split(/[\s,;.]+/)) for (const k of R.knownKeys(A.Lg, w, A.lemmas)) if (!A.st.marked.includes(k)) A.st.marked.push(k);
      const added = A.st.marked.length - before;
      plan(); saveState();
      A.info = added ? `Added ${plural(added, "word")} of this book as known.` : "None of those words are in this book, or you’d marked them already.";
      render(); break;
    }
    case "anki": await offerFile(`${A.st.title} - Readfirst words.txt`, ankiText(), "Your words for Anki (tab-separated text)"); break;
    case "backup": await offerFile(`${A.st.title} - Readfirst progress.json`, JSON.stringify({readfirst: 3, state: A.st}), "Progress backup"); break;
    case "restore": { const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = () => inp.files[0] && restore(inp.files[0]); inp.click(); break; }
    case "copy": { const ta = $("copy-area"); try { await navigator.clipboard.writeText(ta.value); el.textContent = "Copied"; } catch (e) { ta.select(); } break; }
    case "copy-close": A.copyText = null; render(); break;
    case "forget": A.confirmForget = true; render(); break;
    case "forget-no": A.confirmForget = false; render(); break;
    case "forget-yes": {
      const id = A.st.id;
      LS.del("book:" + id); LS.set("library", (LS.get("library") || []).filter(b => b.id !== id)); await IDB.del(id);
      A.confirmForget = false; A.st = null; A.view = "home"; render(); break;
    }
  }
});
document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "file" && t.files[0]) { A.error = ""; A.info = ""; await importFile(t.files[0]); t.value = ""; return; }
  if (A.view === "onboard" && t.id === "ob-lang") {
    A.ob.lang = t.value; A.ob.level = null; A.ob.check = null;
    try { await analyse(t.value, A.ob.start); presetLevel(); } catch (e) { A.busy = ""; A.error = e.message; }
    A.view = "onboard"; render(); return;
  }
  if (A.view === "onboard" && t.id === "ob-start") { A.ob.start = +t.value; A.doc.start = A.ob.start; A.pages = R.pagesOf(A.doc, PAGE); render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.target.closest("input,textarea,select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "Escape") { hidePop(); return; }
  if (A.view === "read" && ev.key === "ArrowRight" && A.cur < A.pages.length - 1) goTo(A.cur + 1);
  else if (A.view === "read" && ev.key === "ArrowLeft" && A.cur > 0) goTo(A.cur - 1);
  else if (A.view === "review" && A.rv && A.rv.queue.length) {
    if (!A.rv.shown && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); A.rv.shown = true; render(); }
    else if (A.rv.shown && ev.key === "1") answer(false);
    else if (A.rv.shown && ev.key === "2") answer(true);
  }
});
const drop = () => $("drop");
document.addEventListener("dragover", ev => { if (A.view === "home" && drop()) { ev.preventDefault(); drop().classList.add("over"); } });
document.addEventListener("dragleave", ev => { if (drop() && !ev.relatedTarget) drop().classList.remove("over"); });
document.addEventListener("drop", ev => {
  if (A.view !== "home") return;
  ev.preventDefault();
  if (drop()) drop().classList.remove("over");
  const f = ev.dataTransfer && ev.dataTransfer.files[0];
  if (f) { A.error = ""; importFile(f); }
});
$("brand").addEventListener("click", () => { A.view = "home"; A.st = null; A.ob = null; A.copyText = null; A.confirmForget = false; A.info = ""; render(); window.scrollTo(0, 0); });

render();
</script>
